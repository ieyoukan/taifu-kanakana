replicaCount: 1

image:
  repository: ghcr.io/ieyoukan/taifu-kanakana
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: cloudflare
  annotations: {}
  hosts:
    - host: taifu-kanakana.youkan.uk
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
